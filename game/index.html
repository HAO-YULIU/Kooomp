<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>魔蝕milner</title>
  <meta name="theme-color" content="#05060a">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="魔蝕milner">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%2214%22 fill=%22%2305060a%22 stroke=%22%23c43a2f%22 stroke-width=%223%22/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
  <script src="vendor/supabase.js" defer></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <div id="backdrop"><i class="fog a"></i><i class="fog b"></i><div class="embers"></div></div>
  <canvas id="view" hidden></canvas>
  <div id="flash"></div>
  <div id="stick"><i></i></div>

  <!-- 18+ 提示 -->
  <section class="screen" id="s-age">
    <div class="card">
      <div class="crest"><i style="--hc:#9fc4ff">✦</i><i style="--hc:#c0454f">❦</i><i style="--hc:#d1a640">⚔</i><i style="--hc:#4fa37a">◎</i></div>
      <h1 class="logo" data-t="title"></h1>
      <p class="tagline" data-t="tagline"></p>
      <div class="lang-row"><span data-t="lang"></span>
        <button class="chip" data-lang="zh">中文</button><button class="chip" data-lang="en">English</button></div>
      <h2 class="warn" data-t="age_title"></h2>
      <p class="pre" data-t="age_body"></p>
      <button class="primary" id="age-ok" data-t="age_ok"></button>
    </div>
  </section>

  <!-- 要登入 -->
  <section class="screen" id="s-login" hidden>
    <div class="card">
      <div class="crest"><i style="--hc:#9fc4ff">✦</i><i style="--hc:#c0454f">❦</i><i style="--hc:#d1a640">⚔</i><i style="--hc:#4fa37a">◎</i></div>
      <h1 class="logo" data-t="title"></h1>
      <p class="tagline" data-t="tagline"></p>
      <h2 data-t="need_login_title"></h2>
      <p id="login-body"></p>
      <a class="primary" id="to-lobby" data-t="to_lobby"></a>
      <details class="dev-login">
        <summary data-t="dev_login"></summary>
        <form id="dev-login-form">
          <input id="dev-email" type="email" autocomplete="username" required>
          <input id="dev-pass" type="password" autocomplete="current-password" required>
          <button class="primary small" type="submit" data-t="dev_login_go"></button>
          <p class="err" id="dev-login-err"></p>
        </form>
      </details>
    </div>
  </section>

  <!-- 選單 -->
  <section class="screen" id="s-menu" hidden>
    <div class="card">
      <div class="crest"><i style="--hc:#9fc4ff">✦</i><i style="--hc:#c0454f">❦</i><i style="--hc:#d1a640">⚔</i><i style="--hc:#4fa37a">◎</i></div>
      <h1 class="logo" data-t="title"></h1>
      <p class="tagline" data-t="tagline"></p>
      <p id="hello"></p>
      <div class="row"><label for="plang" data-t="puzzle_lang"></label>
        <select id="plang"><option value="zh">中文</option><option value="en">English</option></select></div>
      <p class="sub" data-t="puzzle_lang_sub"></p>
      <button class="primary" id="btn-continue" hidden><b data-t="continue"></b><small></small></button>
      <button class="primary" id="btn-solo"><b data-t="solo"></b><small data-t="solo_sub"></small></button>
      <button class="primary" id="btn-create"><b data-t="create"></b><small data-t="create_sub"></small></button>
      <div class="join">
        <input id="join-code" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false">
        <button id="btn-join" data-t="join"></button>
      </div>
      <p class="err" id="menu-err"></p>
      <p class="sub" id="save-info"></p>
    </div>
  </section>

  <!-- 等待室：① 分院鏡 → ② 選角色（看得到角色）→ ③ 準備 -->
  <section class="screen" id="s-wait" hidden>
    <div class="wait">
      <div class="stage">
        <canvas id="char-stage"></canvas>
        <div class="stage-info" id="stage-info">
          <b id="stage-name"></b><small id="stage-house"></small>
          <p id="stage-blurb"></p><p class="power" id="stage-power"></p>
        </div>
        <p class="stage-tip" data-t="stage_tip"></p>
      </div>
      <div class="card side">
        <div class="code-row"><span data-t="room"></span> <b id="room-code"></b></div>
        <ul id="member-list"></ul>
        <ol class="steps">
          <li id="step-sort"><h3><i>Ⅰ</i><span data-t="sorting"></span></h3>
            <div class="houses" id="house-pick"></div><p class="sub" id="sorted-hint"></p></li>
          <li id="step-char"><h3><i>Ⅱ</i><span data-t="choose_char"></span></h3>
            <div class="chars" id="char-pick"></div><p class="sub" id="char-lock"></p></li>
          <li id="step-ready"><h3><i>Ⅲ</i><span data-t="get_ready"></span></h3>
            <div class="row end">
              <button id="btn-leave" data-t="leave"></button>
              <button id="btn-ready"></button>
              <button class="primary small" id="btn-start" data-t="start" hidden></button>
            </div></li>
        </ol>
        <p class="err" id="wait-err"></p>
      </div>
    </div>
  </section>

  <!-- 遊戲中的介面 -->
  <section id="hud" hidden>
    <div id="status"></div>
    <div id="team"></div>
    <div id="marks">
      <button data-mark="here" data-t="mark_here"></button>
      <button data-mark="danger" data-t="mark_danger"></button>
      <button data-mark="help" data-t="mark_help"></button>
      <small class="keys" data-t="mark_keys"></small>
    </div>
    <div id="chat">
      <ul id="chat-log"></ul>
      <input id="chat-input" maxlength="200" autocomplete="off">
    </div>
    <button id="btn-full" hidden>⛶</button>
    <div id="toast"></div>
    <div id="prompt" hidden></div>
    <div id="actions">
      <button id="btn-inspect" data-t="inspect"></button>
      <button id="btn-wand" data-t="wand"></button>
      <button id="btn-breath" data-t="breath"></button>
      <button id="btn-notebook" data-t="notebook"></button>
      <button id="btn-familiar" data-t="familiar" hidden></button>
      <small class="keys">E　F　Q　N　V</small>
    </div>
    <div id="dev" hidden>
      <b data-t="dev_panel"></b>
      <div class="row"><input id="dev-pid" value="P02" size="4"><input id="dev-val" placeholder='值（陣列／物件請寫 JSON）'></div>
      <div class="row"><button id="dev-answer" data-t="answer"></button><button id="dev-hint" data-t="hint"></button><button id="dev-peek">peek</button></div>
      <pre id="dev-out"></pre>
    </div>
  </section>

  <!-- 手機方向不對時的提示（遊戲橫向、魔杖直向） -->
  <section id="rotate" hidden><div class="phone"></div><p data-text></p><button data-cancel hidden></button></section>

  <!-- 劇情對話、謎題視窗（等待室的分院鏡也會用到，所以放在 hud 外面） -->
  <div id="dialog" hidden><b id="dialog-who"></b><p id="dialog-text"></p><small class="more">▼</small></div>
  <div id="panel" hidden>
    <div class="panel-head"><b id="panel-title"></b><button id="panel-close">✕</button></div>
    <div id="panel-body"></div>
  </div>
</body>
</html>
