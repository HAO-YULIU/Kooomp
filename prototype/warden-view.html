<!doctype html><meta charset="utf-8"><title>守夜人蝕化測試</title>
<style>html,body{margin:0;background:#111;overflow:hidden}</style>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
<!-- 帳號二的測試頁：守夜人正式模型＋蝕化，從前、後、側、臉部特寫看。從儲存庫根目錄開伺服器。window.shot(角度, 距離, 高度, 動作, 秒) -->
<script type="module">
import * as THREE from 'three';
import { loadWardenModel, setWardenBase } from '../game/src/art/warden.mjs';
setWardenBase('../game/models/chars/');
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(innerWidth, innerHeight); document.body.appendChild(r.domElement);
r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 1.3;
const s = new THREE.Scene(); s.background = new THREE.Color('#15161a');
s.add(new THREE.HemisphereLight('#9aa0b8', '#3a2e24', 1.4)); const k = new THREE.DirectionalLight('#ffe0c0', 2.5); k.position.set(2, 4, -3); s.add(k); const b = new THREE.DirectionalLight('#8090ff', 1.5); b.position.set(-2, 3, 4); s.add(b);
const w = await loadWardenModel(); s.add(w.root);
const cam = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.05, 50);
window.shot = (ang, dist = 3.5, y = 1.1, anim = 'idle', sec = 1) => {
  w.play(anim, 0); for (let i = 0; i < sec * 30; i++) w.update(1 / 30, anim === 'run' ? 'chase' : 'patrol');
  cam.position.set(Math.sin(ang) * dist, y, -Math.cos(ang) * dist); cam.lookAt(0, y * 0.85, 0); r.render(s, cam);
};
window.ready = true;
</script>
