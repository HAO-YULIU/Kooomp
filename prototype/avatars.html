<!doctype html><body style="margin:0"><canvas id="c" width="1200" height="700"></canvas>
<!-- 正式遊戲角色的測試頁：載入 game/models/chars/ 烘焙好的模型。網址加 #yuexi,vaughn 指定角色。從儲存庫根目錄開伺服器才看得到 game/ -->
<script type="importmap">{ "imports": { "three": "../prototype/vendor/three.module.min.js" } }</script>
<script type="module">
import * as THREE from 'three';
import { loadCharacter, setCharacterBase } from '../game/src/art/characters.mjs';
setCharacterBase('../game/models/chars/');
const r = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true }); r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 1.1;
const s = new THREE.Scene(); s.background = new THREE.Color('#1a1816');
s.add(new THREE.HemisphereLight('#a0a8c0', '#3a2a20', 1.2)); const k = new THREE.DirectionalLight('#ffe0c0', 2.2); k.position.set(1.5, 3, -3); s.add(k);
const cam = new THREE.PerspectiveCamera(30, 12 / 7, 0.05, 50);
const list = []; const keys = window.KEYS || (location.hash ? location.hash.slice(1).split(',') : ['elora', 'yuexi', 'vaughn', 'cyril']);
for (const [i, key] of keys.entries()) { const c = await loadCharacter(key); c.root.position.x = (i - (keys.length - 1) / 2) * 0.9; s.add(c.root); list.push(c); }
list[1]?.setMood('smile'); list[1]?.talk(5);
window.shot = (mode) => { const p = mode === 'face' ? new THREE.Vector3(0.3, 1.45, -2.2) : new THREE.Vector3(0, 1.0, -5.2); for (let i = 0; i < 20; i++) list.forEach((q) => q.update(0.05, p)); cam.position.copy(p); cam.lookAt(0, mode === 'face' ? 1.35 : 0.9, 0); r.render(s, cam); };
window.walk = (v, sec = 0.6) => { list.forEach((q) => q.setMoving(v)); for (let i = 0; i < sec * 30; i++) list.forEach((q) => q.update(1 / 30)); };
window.side = () => { cam.position.set(5.5, 1.0, 0); cam.lookAt(0, 0.9, 0); r.render(s, cam); };
window.ready = true;
</script></body>
